name: Inspect youtube_explode
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: |
          mkdir p && cd p && dart create -t console x >/dev/null && cd x
          dart pub add youtube_explode_dart:^3.1.0 >/dev/null
          D=$(ls -d ~/.pub-cache/hosted/pub.dev/youtube_explode_dart-3*/ | tail -1)
          for f in lib/solvers.dart lib/js_challenge.dart lib/src/reverse_engineering/challenges/js_challenge.dart lib/src/reverse_engineering/challenges/ejs/base_ejs_solver.dart lib/src/reverse_engineering/challenges/ejs/deno_ejs_solver.dart lib/src/reverse_engineering/challenges/ejs/ejs.dart; do echo "=== $f"; cat $D/$f; done
          echo "=== modules size"; wc -c $D/lib/src/reverse_engineering/challenges/ejs/ejs_modules.g.dart; head -c 600 $D/lib/src/reverse_engineering/challenges/ejs/ejs_modules.g.dart
