name: Inspect youtube_explode
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: |
          mkdir p && cd p && dart create -t console x >/dev/null && cd x
          dart pub add youtube_explode_dart:^3.1.0 >/dev/null
          D=$(ls -d ~/.pub-cache/hosted/pub.dev/youtube_explode_dart-3*/ | tail -1); echo $D
          echo "--- changelog"; head -50 $D/CHANGELOG.md
          echo "--- clients"; grep -n "static const [a-zA-Z]* = YoutubeApiClient" $D/lib/src/videos/youtube_api_client.dart
          echo "--- getManifest signature"; grep -n -A8 "Future<StreamManifest> getManifest" $D/lib/src/videos/streams/stream_client.dart
          echo "--- requireWatchPage / po"; grep -rn -i "potoken\|requireWatchPage\|visitorData" $D/lib | head -12
