name: Inspect youtube_explode
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: |
          mkdir p && cd p && dart create -t console x >/dev/null && cd x
          dart pub add youtube_explode_dart:^3.1.0 >/dev/null
          D=$(ls -d ~/.pub-cache/hosted/pub.dev/youtube_explode_dart-3*/ | tail -1)
          echo "--- tree"; find $D/lib -path '*js*' -o -path '*solver*' -o -path '*challenge*' | head -40
          echo "--- README solver"; grep -n -i -B2 -A25 "solver\|deno\|ejs" $D/README.md | head -120
          echo "--- YoutubeExplode ctor"; grep -n -A25 "class YoutubeExplode" $D/lib/src/youtube_explode_base.dart | head -60
