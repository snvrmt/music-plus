name: Build iOS (unsigned IPA)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The ios/ folder is generated here, so you never need a Mac to create it.
      - name: Generate iOS project if missing
        run: |
          if [ ! -d ios ]; then
            flutter create . --platforms=ios --org com.personal --project-name music_player
          fi

      - name: Configure Info.plist
        run: |
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Music+" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Music+" "$PLIST"
          # Keep audio playing when the screen locks (needed from Phase 2 on).
          if ! /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST"
          fi

      - name: Build
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          # Pods (e.g. flutter_js) must not ask for a signing team: we sign
          # later with SideStore.
          flutter build ios --config-only --release --no-codesign
          if [ -f ios/Podfile ] && ! grep -q CODE_SIGNING_ALLOWED ios/Podfile; then
            sed -i '' "s/flutter_additional_ios_build_settings(target)/flutter_additional_ios_build_settings(target)\\
              target.build_configurations.each do |config|\\
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'\\
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'\\
              end/" ios/Podfile
          fi
          if [ -f ios/Podfile ]; then sed -n '/post_install/,$p' ios/Podfile; (cd ios && pod install); fi
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee build.log || { grep -n -E "error:|Error:" build.log | head -40; exit 1; }

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr MusicPlayer.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer-ipa
          path: MusicPlayer.ipa
