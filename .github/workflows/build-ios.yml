name: Build iOS (unsigned IPA)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Dart code
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings lib

      # The ios/ folder is generated here, so you never need a Mac to create it.
      - name: Generate iOS project if missing
        run: |
          if [ ! -d ios ]; then
            flutter create . --platforms=ios --org com.personal --project-name music_player
          fi

      - name: Configure Info.plist
        run: |
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Music+" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Music+" "$PLIST"
          # Keep audio playing when the screen locks (needed from Phase 2 on).
          if ! /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST"
          fi

      - name: Build
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          # Pods (e.g. flutter_js) must not ask for a signing team: we sign
          # later with SideStore.
          flutter build ios --config-only --release --no-codesign
          if [ -f ios/Podfile ] && ! grep -q CODE_SIGNING_ALLOWED ios/Podfile; then
            sed -i '' "s/flutter_additional_ios_build_settings(target)/flutter_additional_ios_build_settings(target)\\
              target.build_configurations.each do |config|\\
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'\\
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'\\
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'\\
              end/" ios/Podfile
          fi
          if [ -f ios/Podfile ]; then
            sed -i '' "s/^# platform :ios.*/platform :ios, '15.0'/" ios/Podfile
            # Make sure the app target picks up the CocoaPods settings.
            for c in debug release profile; do
              C=$(echo $c | awk '{print toupper(substr($0,1,1)) substr($0,2)}')
              f=ios/Flutter/$C.xcconfig
              [ -f $f ] || continue
              grep -q "Pods-Runner.$c.xcconfig" $f || \
                sed -i '' "1s;^;#include? \"Pods/Target Support Files/Pods-Runner/Pods-Runner.$c.xcconfig\"\n;" $f
              echo "== $f"; cat $f
            done
            (cd ios && pod install)
          fi
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee build.log || {
            set +e +o pipefail
            echo "=== xcodebuild errors"
            cd ios
            xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO build > xc.log 2>&1
            echo "xcodebuild exit $?"
            grep -n -E "error:|Error:|\\*\\* BUILD|Signing|signing|requires a development team" xc.log | head -60
            echo "--- tail"; tail -30 xc.log; echo "--- failed cmds"; grep -n -i -A3 "command.*failed\|fatal\|Undefined symbol\|not found" xc.log | head -40
            exit 1; }

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr MusicPlayer.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer-ipa
          path: MusicPlayer.ipa
