name: Smoke test YouTube source

on:
  workflow_dispatch:
    inputs:
      query:
        description: Search query
        default: Daft Punk Get Lucky

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get && grep -A4 "youtube_explode_dart:" pubspec.lock | grep version
      # Note: YouTube blocks stream lookups from GitHub's data-centre IPs
      # ("Sign in to confirm you're not a bot"), so only search is meaningful here.
      - run: dart run tool/smoke_test.dart "${{ github.event.inputs.query || 'Daft Punk Get Lucky' }}"
      - run: dart run tool/player_probe.dart
        if: always()
